[package]
name = "licenz-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline software license verification with RSA signatures, hardware binding, and anti-tamper detection"
readme = "README.md"
repository = "https://github.com/outboundlabs/licenz"
homepage = "https://licenz.dev"
keywords = ["license", "licensing", "offline", "cryptography", "verification"]
categories = ["authentication", "cryptography"]

[features]
default = []
# Cloud container detection (AWS, GCP, Azure instance IDs)
cloud-metadata = ["dep:url"]
# Post-quantum cryptography support (Dilithium3, Kyber768, hybrid modes)
# Note: Significantly increases binary size (~2MB) but provides quantum resistance
post-quantum = ["dep:pqcrypto-dilithium", "dep:pqcrypto-kyber", "dep:pqcrypto-traits"]

[dependencies]
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
pem = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
tracing = "0.1"
dirs-next = "2"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Hardware detection (always enabled - core feature)
sysinfo = "0.30"
mac_address = "1"
hostname = "0.3"

# Online validation (always available, use via configuration)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Optional URL parsing for cloud metadata
url = { version = "2", optional = true }

# Optional post-quantum cryptography
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-kyber = { version = "0.8", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
