name: CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    environment: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && 'rust-cache-writer' || 'rust-cache-reader' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Configure private R2 Rust cache
        id: rust-r2-cache
        uses: matt-cochran-products/infra/.github/actions/rust-r2-cache@dd131cdc7925296155cdaee8d7c1147c86ba1134
        with:
          enabled: ${{ vars.RUST_SCCACHE_R2_ENABLED || 'false' }}
          bucket: ${{ vars.RUST_SCCACHE_R2_BUCKET }}
          endpoint: ${{ vars.RUST_SCCACHE_R2_ENDPOINT }}
          read-access-key-id: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_ACCESS_KEY_ID || '' }}
          read-secret-access-key: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_SECRET_ACCESS_KEY || '' }}
          write-access-key-id: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_ACCESS_KEY_ID || '' }}
          write-secret-access-key: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_SECRET_ACCESS_KEY || '' }}
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features
      - name: Record R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          { printf '\n### R2 compilation cache\n\n```text\n'; sccache --show-stats; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats --stats-format json > "$RUNNER_TEMP/rust-r2-cache-stats.json"
      - name: Retain R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-r2-cache-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-r2-cache-stats.json
          retention-days: 7
          if-no-files-found: warn

  # Test baseline (no optional features)
  baseline:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    environment: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && 'rust-cache-writer' || 'rust-cache-reader' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure private R2 Rust cache
        id: rust-r2-cache
        uses: matt-cochran-products/infra/.github/actions/rust-r2-cache@dd131cdc7925296155cdaee8d7c1147c86ba1134
        with:
          enabled: ${{ vars.RUST_SCCACHE_R2_ENABLED || 'false' }}
          bucket: ${{ vars.RUST_SCCACHE_R2_BUCKET }}
          endpoint: ${{ vars.RUST_SCCACHE_R2_ENDPOINT }}
          read-access-key-id: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_ACCESS_KEY_ID || '' }}
          read-secret-access-key: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_SECRET_ACCESS_KEY || '' }}
          write-access-key-id: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_ACCESS_KEY_ID || '' }}
          write-secret-access-key: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_SECRET_ACCESS_KEY || '' }}
      - name: Build baseline
        run: cargo build -p licenz-core

      - name: Test baseline
        run: cargo test -p licenz-core
      - name: Record R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          { printf '\n### R2 compilation cache\n\n```text\n'; sccache --show-stats; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats --stats-format json > "$RUNNER_TEMP/rust-r2-cache-stats.json"
      - name: Retain R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-r2-cache-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-r2-cache-stats.json
          retention-days: 7
          if-no-files-found: warn

  # Check documentation
  docs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    environment: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && 'rust-cache-writer' || 'rust-cache-reader' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure private R2 Rust cache
        id: rust-r2-cache
        uses: matt-cochran-products/infra/.github/actions/rust-r2-cache@dd131cdc7925296155cdaee8d7c1147c86ba1134
        with:
          enabled: ${{ vars.RUST_SCCACHE_R2_ENABLED || 'false' }}
          bucket: ${{ vars.RUST_SCCACHE_R2_BUCKET }}
          endpoint: ${{ vars.RUST_SCCACHE_R2_ENDPOINT }}
          read-access-key-id: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_ACCESS_KEY_ID || '' }}
          read-secret-access-key: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_SECRET_ACCESS_KEY || '' }}
          write-access-key-id: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_ACCESS_KEY_ID || '' }}
          write-secret-access-key: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_SECRET_ACCESS_KEY || '' }}
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Record R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          { printf '\n### R2 compilation cache\n\n```text\n'; sccache --show-stats; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats --stats-format json > "$RUNNER_TEMP/rust-r2-cache-stats.json"
      - name: Retain R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-r2-cache-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-r2-cache-stats.json
          retention-days: 7
          if-no-files-found: warn

  # Catch crates.io packaging issues without uploading
  publish-dry-run:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features

  # MSRV check
  msrv:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    environment: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && 'rust-cache-writer' || 'rust-cache-reader' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      # rust-toolchain.toml pins the development toolchain; override it here so
      # this job really builds on the MSRV declared in Cargo.toml.
      - name: Use the MSRV toolchain instead of rust-toolchain.toml
        run: echo "RUSTUP_TOOLCHAIN=1.89" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure private R2 Rust cache
        id: rust-r2-cache
        uses: matt-cochran-products/infra/.github/actions/rust-r2-cache@dd131cdc7925296155cdaee8d7c1147c86ba1134
        with:
          enabled: ${{ vars.RUST_SCCACHE_R2_ENABLED || 'false' }}
          bucket: ${{ vars.RUST_SCCACHE_R2_BUCKET }}
          endpoint: ${{ vars.RUST_SCCACHE_R2_ENDPOINT }}
          read-access-key-id: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_ACCESS_KEY_ID || '' }}
          read-secret-access-key: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RUST_SCCACHE_R2_READ_SECRET_ACCESS_KEY || '' }}
          write-access-key-id: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_ACCESS_KEY_ID || '' }}
          write-secret-access-key: ${{ vars.RUST_SCCACHE_R2_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.ref_protected && secrets.RUST_SCCACHE_R2_WRITE_SECRET_ACCESS_KEY || '' }}
      - name: Build (MSRV, default features)
        run: cargo build -p licenz-core

      - name: Test (MSRV, default features)
        run: cargo test -p licenz-core
      - name: Record R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          { printf '\n### R2 compilation cache\n\n```text\n'; sccache --show-stats; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats --stats-format json > "$RUNNER_TEMP/rust-r2-cache-stats.json"
      - name: Retain R2 compilation cache statistics
        if: ${{ always() && steps.rust-r2-cache.outputs.active == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-r2-cache-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-r2-cache-stats.json
          retention-days: 7
          if-no-files-found: warn

  # Security audit
  security:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit

  build-gate:
    name: Build gate
    needs:
    - test
    - baseline
    - docs
    - publish-dry-run
    - msrv
    - security
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_RESULTS: ${{ toJSON(needs) }}
    steps:
    - name: Require successful build checks
      run: "python3 - <<'PY'\nimport json, os, sys\nresults = json.loads(os.environ[\"BUILD_RESULTS\"])\nbad = {name: job[\"result\"] for name, job in results.items() if job[\"result\"] not in (\"success\", \"skipped\")}\nif bad or not any(job[\"result\"] == \"success\" for job in results.values()):\n    print(\"Build gate failed:\", bad or \"all checks skipped\")\n    sys.exit(1)\nprint(\"All applicable build checks passed\")\nPY\n"
