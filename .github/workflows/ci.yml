name: CI

on:
  pull_request:
    branches:
    - staging
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features

  # Test baseline (no optional features)
  baseline:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build baseline
        run: cargo build -p licenz-core

      - name: Test baseline
        run: cargo test -p licenz-core

  # Check documentation
  docs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  # Catch crates.io packaging issues without uploading
  publish-dry-run:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features

  # MSRV check
  msrv:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (MSRV, default features)
        run: cargo build -p licenz-core

      - name: Test (MSRV, default features)
        run: cargo test -p licenz-core

  # Security audit
  security:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit

  build-gate:
    name: Build gate
    needs:
    - test
    - baseline
    - docs
    - publish-dry-run
    - msrv
    - security
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_RESULTS: ${{ toJSON(needs) }}
    steps:
    - name: Require successful build checks
      run: "python3 - <<'PY'\nimport json, os, sys\nresults = json.loads(os.environ[\"BUILD_RESULTS\"])\nbad = {name: job[\"result\"] for name, job in results.items() if job[\"result\"] not in (\"success\", \"skipped\")}\nif bad or not any(job[\"result\"] == \"success\" for job in results.values()):\n    print(\"Build gate failed:\", bad or \"all checks skipped\")\n    sys.exit(1)\nprint(\"All applicable build checks passed\")\nPY\n"
