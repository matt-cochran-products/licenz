[package]
name = "licenz-cli"
version.workspace = true
edition = "2021"
license.workspace = true
description = "CLI tool for license generation and verification"
readme = "README.md"

[[bin]]
name = "licenz"
path = "src/main.rs"

[dependencies]
licenz-core = { path = "../licenz-core", features = ["hardware-binding"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
colored = "2"
