[package]
name = "licenz-cli"
version.workspace = true
edition = "2021"
license.workspace = true
description = "CLI tool for license generation and verification"
readme = "README.md"

[[bin]]
name = "licenz"
path = "src/main.rs"

[features]
default = ["server"]
server = ["licenz-api-client", "tokio", "reqwest", "futures", "toml", "directories", "base64"]
# Optional secure credential storage using OS keyring
keyring = ["dep:keyring"]

[dependencies]
# Generated API client from OpenAPI spec (contract-first)
# For development, use path dependency. For release, switch to git:
# licenz-api-client = { git = "ssh://git@github.com/outboundlabs/licenz-saas", optional = true }
licenz-api-client = { path = "../../../licenz-saas/crates/licenz-api-client", optional = true }
# Async runtime for blocking on async client
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
licenz-core = { path = "../licenz-core", features = ["hardware-binding"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
colored = "2"

# Server feature dependencies (optional)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true, default-features = false }
futures = { version = "0.3", optional = true }
toml = { version = "0.8", optional = true }
directories = { version = "5.0", optional = true }
base64 = { version = "0.22", optional = true }

# Optional secure credential storage
keyring = { version = "2", optional = true }
url = "2"
